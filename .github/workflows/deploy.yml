name: Deploy to GitHub Pages

on:
  push:
    branches: [misa-feedback]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 빌드 없이 정적 파일을 그대로 배포 (apps-script 폴더와 .github는 제외)
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html config.js assets .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
